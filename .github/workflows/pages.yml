name: Veröffentlichen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logik
        run: node tools/test-logic.mjs
      - name: Rechen-Logik
        run: node tools/test-rechnen.mjs
      - name: Browser installieren
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Alle Modi
        run: node tools/e2e.mjs
      - name: Abläufe
        run: node tools/e2e-flows.mjs
      - name: Tagesmission, stumme Karte, Eltern-Übersicht
        run: node tools/e2e-features.mjs
      - name: Kopfrechnen
        run: node tools/e2e-rechnen.mjs
      - name: Begleiter, Boss, Rennen
        run: node tools/e2e-begleiter.mjs
      - name: Mehrere Antworten, stumme Karte als Blatt
        run: node tools/e2e-blatt.mjs
      - name: Alte und kaputte Spielstände
        run: node tools/test-migration.mjs
      - name: Tageswechsel, Serie, Countdown
        run: node tools/test-tageswechsel.mjs
      - name: Zufälliges Durchklicken
        run: node tools/monkey.mjs 300 1
      - name: iPad-Größen
        run: node tools/e2e-devices.mjs chromium
      - name: Offline
        run: node tools/test-offline.mjs
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
